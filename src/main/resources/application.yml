spring:
  application:
    name: acadia
  main:
    web-application-type: servlet
  threads:
    virtual:
      enabled: true
  output:
    ansi:
      enabled: always
  cloud:
    gateway:
      server:
        webmvc:
          httpclient:
            connect-timeout: 1000
            read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO

jwt:
  # Production must provide JWT_SECRET; the default below is for local/dev and tests only.
  secret: ${JWT_SECRET:default-secret-key-for-testing-purposes-only-32bytes}

gateway:
  rate-limit:
    enabled: true
    limit: 10
    burst: 20
    window-ms: 1000
  cors:
    allowed-origins:
      - "https://example.com"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  logging:
    enabled: true
    storage: none  # none | file
    include-headers: false
    include-query-params: true
    file:
      path: ./logs/gateway-requests.log
  services:
    - name: user-service
      path: /api/users/**
      url: http://localhost:8081
      strip-prefix: 1
      has-public-path: true
    - name: order-service
      path: /api/orders/**
      url: http://localhost:8082
      strip-prefix: 1
      has-public-path: false
  retry:
    retries: 3
    statuses:
      - INTERNAL_SERVER_ERROR
    methods:
      - GET

resilience4j:
  circuitbreaker:
    # Per-service instances (cb-{service.name}) are created lazily with this default config,
    # so adding a service needs no resilience4j entry. Override a single service with
    # instances.cb-{service.name} if it ever needs different thresholds.
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
