spring:
  application:
    name: acadia
  main:
    web-application-type: reactive
  output:
    ansi:
      enabled: always
  jpa:
    # JPA is disabled when no datasource is configured
    # To enable: set spring.datasource.url and gateway.logging.storage=db
    open-in-view: false
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
management:
  endpoints:
    web:
      exposure:
        include: health,gateway,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

gateway:
  rate-limit:
    limit: 10
    window-ms: 1000
  cors:
    allowed-origins:
      - "https://example.com"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  logging:
    enabled: false
    storage: none  # none | file | db
    include-headers: false
    include-query-params: true
    file:
      path: ./logs/gateway-requests.log
  services:
    - name: user-service
      path: /api/users/**
      url: http://localhost:8081
      strip-prefix: 1
      has-public-path: true
    - name: order-service
      path: /api/orders/**
      url: http://localhost:8082
      strip-prefix: 1
      has-public-path: false
  retry:
    retries: 3
    statuses:
      - INTERNAL_SERVER_ERROR
    methods:
      - GET

resilience4j:
  circuitbreaker:
    instances:
      gatewayCircuitBreaker:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
