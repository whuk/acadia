spring:
  application:
    name: acadia
  main:
    web-application-type: reactive
  output:
    ansi:
      enabled: always
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

gateway:
  services:
    - name: user-service
      path: /api/users/**
      url: http://localhost:8081
      strip-prefix: 1
      has-public-path: true
    - name: order-service
      path: /api/orders/**
      url: http://localhost:8082
      strip-prefix: 1
      has-public-path: false
  retry:
    retries: 3
    statuses:
      - INTERNAL_SERVER_ERROR
    methods:
      - GET
